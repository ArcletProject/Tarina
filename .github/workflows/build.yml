name: Build

on:
  pull_request:
    types:
      - opened
    paths:
      - 'src/tarina/_op.h'
      - 'src/tarina/*_c.c'
      - 'src/tarina/*_c.pyx'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and pure wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: 3.13
      - name: Ensure PDM
        run: |
          python3 -m pip install pdm
      - name: Install Package
        run: |
          pdm sync -G:all --no-self
      - name: Cythonize
        run: |
          pdm run make
      - name: Build sdist
        run: |
          pipx run build --sdist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: pkg-sdist
          path: dist/*.tar.gz
      - name: Build pure wheel
        run: |
          export TARINA_NO_EXTENSIONS=1
          pipx run build --wheel
      - name: Upload pure wheel
        uses: actions/upload-artifact@v7
        with:
          name: pkg-pure-wheel
          path: dist/*.whl

  build_wheels:
    name: Build wheels on ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - name: linux-x86_64
            runs-on: ubuntu-latest
            qemu: ""
            musl: ""
          - name: linux-aarch64
            runs-on: ubuntu-24.04-arm
            qemu: ""
            musl: ""
          - name: linux-musllinux-x86_64
            runs-on: ubuntu-latest
            qemu: ""
            musl: musllinux
          - name: linux-musllinux-aarch64
            runs-on: ubuntu-24.04-arm
            qemu: ""
            musl: musllinux
          - name: windows-x86_64
            runs-on: windows-latest
            qemu: ""
            musl: ""
          - name: windows-arm64
            runs-on: windows-11-arm
            qemu: ""
            musl: ""
          - name: macos-x86_64
            runs-on: macos-15-intel
            qemu: ""
            musl: ""
          - name: macos-arm64
            runs-on: macos-15
            qemu: ""
            musl: ""
          # Split ubuntu/musl jobs for the sake of speed-up
          - name: linux-ppc64le
            runs-on: ubuntu-latest
            qemu: ppc64le
            musl: ""
          - name: linux-armv7l
            runs-on: ubuntu-latest
            qemu: armv7l
            musl: ""
          - name: linux-s390x
            runs-on: ubuntu-latest
            qemu: s390x
            musl: ""
          - name: linux-riscv64
            runs-on: ubuntu-latest
            qemu: riscv64
            musl: ""
          - name: linux-musllinux-riscv64
            runs-on: ubuntu-latest
            qemu: riscv64
            musl: musllinux
          - name: linux-musllinux-s390x
            runs-on: ubuntu-latest
            qemu: s390x
            musl: musllinux
          - name: linux-musllinux-ppc64le
            runs-on: ubuntu-latest
            qemu: ppc64le
            musl: musllinux
          - name: linux-musllinux-armv7l
            runs-on: ubuntu-latest
            qemu: armv7l
            musl: musllinux

          - name: android-x86_64
            runs-on: ubuntu-latest
            platform: android
            archs: x86_64
            qemu: ""
            musl: ""
          - name: android-arm64
            runs-on: ubuntu-latest
            platform: android
            archs: arm64_v8a
            qemu: ""
            musl: ""
          - name: ios-arm64
            runs-on: macos-latest
            platform: ios
            archs: arm64_iphoneos
            qemu: ""
            musl: ""
          - name: ios-simulator-arm64
            runs-on: macos-latest
            platform: ios
            archs: arm64_iphonesimulator
            qemu: ""
            musl: ""
          - name: ios-simulator-x86_64
            runs-on: macos-15-intel
            platform: ios
            archs: x86_64_iphonesimulator
            qemu: ""
            musl: ""
    steps:
      - uses: actions/checkout@v7
        with:
            persist-credentials: false
      - name: Set up QEMU
        if: runner.os == 'Linux' && runner.arch == 'X64' && matrix.qemu != ''
        uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: all
          image: tonistiigi/binfmt:qemu-v8.1.5
        id: qemu
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.13
      - name: Ensure PDM
        run: |
          python3 -m pip install pdm
      - name: Install Package
        run: |
          pdm sync -G:all --no-self
      - name: Cythonize
        run: |
          pdm run make
      - name: Configure macOS architecture
        if: runner.os == 'macOS'
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=13.0" >> $GITHUB_ENV
          if [[ "${{ runner.arch}}" == "ARM64" ]]; then
            echo "CIBW_ARCHS_MACOS=arm64" >> $GITHUB_ENV
          else
            echo "CIBW_ARCHS_MACOS=x86_64" >> $GITHUB_ENV
          fi
        shell: bash
      - name: Prepare emulation
        run: |
          if [[ -n "${{ matrix.qemu }}" && "${{ runner.arch }}" == "X64" ]]; then
            # Build emulated architectures only if QEMU is set,
            # use default "auto" otherwise
            echo "CIBW_ARCHS_LINUX=${{ matrix.qemu }}" >> $GITHUB_ENV
          else
            echo "CIBW_ARCHS_LINUX=auto" >> $GITHUB_ENV
          fi
        shell: bash
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_PLATFORM: ${{ matrix.platform || 'auto' }}
          CIBW_ARCHS: ${{ matrix.archs || 'auto' }}
          ANDROID_API_LEVEL: '24'
          IPHONEOS_DEPLOYMENT_TARGET: '13.0'
          CIBW_SKIP: pp* ${{ matrix.musl == 'musllinux' && '*manylinux*' || '*musllinux*' }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: >-
            pkg-wheels-${{ matrix.name }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    needs: [build, build_wheels]
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: pkg-*
          merge-multiple: true
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          verbose: true
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
      - name: upload release asset
        run: |
          gh release upload ${{ github.event.release.tag_name }} dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
