name: Build

on:
  pull_request:
    types:
      - opened
    paths:
      - 'src/tarina/_op.h'
      - 'src/tarina/*_c.c'
      - 'src/tarina/*_c.pyx'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and pure wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: 3.13
      - name: Ensure PDM
        run: |
          python3 -m pip install pdm
      - name: Install Package
        run: |
          pdm sync -G:all --no-self
      - name: Cythonize
        run: |
          pdm run make
      - name: Build sdist
        run: |
          pipx run build --sdist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: pkg-sdist
          path: dist/*.tar.gz
      - name: Build pure wheel
        run: |
          export TARINA_NO_EXTENSIONS=1
          pipx run build --wheel
      - name: Upload pure wheel
        uses: actions/upload-artifact@v7
        with:
          name: pkg-pure-wheel
          path: dist/*.whl

  build_wheels:
    name: Build wheels on ${{ matrix.os }} ${{ matrix.qemu }} ${{ matrix.musl }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest,
          - ubuntu-24.04-arm,
          - windows-latest,
          - windows-11-arm,
          - macos-15-intel,
          - macos-15
        qemu: [ '' ]
        musl: [ "" ]
        include:
          # Split ubuntu/musl jobs for the sake of speed-up
          - os: ubuntu-latest
            qemu: ppc64le
            musl: ""
          - os: ubuntu-latest
            qemu: armv7l
            musl: ""
          - os: ubuntu-latest
            qemu: s390x
            musl: ""
          - os: ubuntu-latest
            qemu: riscv64
            musl: ""
          - os: ubuntu-latest
            qemu: riscv64
            musl: musllinux
          - os: ubuntu-latest
            qemu: s390x
            musl: musllinux
          - os: ubuntu-latest
            qemu: ppc64le
            musl: musllinux
          - os: ubuntu-latest
            qemu: armv7l
            musl: musllinux
          - os: ubuntu-latest
            musl: musllinux
          - os: ubuntu-24.04-arm
            musl: musllinux
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU
        if: runner.os == 'Linux' && runner.arch == 'X64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all
          image: tonistiigi/binfmt:qemu-v8.1.5
        id: qemu
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.13
      - name: Ensure PDM
        run: |
          python3 -m pip install pdm
      - name: Install Package
        run: |
          pdm sync -G:all --no-self
      - name: Cythonize
        run: |
          pdm run make
      - name: Configure macOS architecture
        if: runner.os == 'macOS'
        run: |
          if [[ "${{ runner.arch}}" == "ARM64" ]]; then
            echo "CIBW_ARCHS_MACOS=arm64" >> $GITHUB_ENV
          else
            echo "CIBW_ARCHS_MACOS=x86_64" >> $GITHUB_ENV
          fi
        shell: bash
      - name: Prepare emulation
        run: |
          if [[ -n "${{ matrix.qemu }}" && "${{ runner.arch }}" == "X64" ]]; then
            # Build emulated architectures only if QEMU is set,
            # use default "auto" otherwise
            echo "CIBW_ARCHS_LINUX=${{ matrix.qemu }}" >> $GITHUB_ENV
          else
            echo "CIBW_ARCHS_LINUX=auto" >> $GITHUB_ENV
          fi
        shell: bash
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_SKIP: pp* ${{ matrix.musl == 'musllinux' && '*manylinux*' || '*musllinux*' }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: >-
            pkg-wheels-${{ matrix.os }}-${{ strategy.job-index }}-${{ matrix.musl }}-${{
              matrix.qemu
              && matrix.qemu
              || 'native'
            }}
          path: ./wheelhouse/*.whl

  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    needs: [build, build_wheels]
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: pkg-*
          merge-multiple: true
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          verbose: true
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
      - name: upload release asset
        run: |
          gh release upload ${{ github.event.release.tag_name }} dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
