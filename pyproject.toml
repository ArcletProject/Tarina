[project]
name = "tarina"
version = "0.8.0"
description = "A collection of common utils for Arclet"
authors = [
    {name = "RF-Tar-Railt", email = "rf_tar_railt@qq.com"},
]
dependencies = [
    "typing-extensions>=4.16.0",
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
yaml = [
    "ruamel-yaml>=0.18.10",
]

[project.scripts]
tarina-lang = "tarina.lang.__main__:main"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
# don't build PyPy wheels, install from source instead
skip = "pp*"

[tool.black]
line-length = 120
target-version = ["py311", "py312", "py313", "py314", "py315"]
include = '\.pyi?$'
extend-exclude = '''
'''

[tool.ruff]
line-length = 120
target-version = "py311"
respect-gitignore = true

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "C", "T", "PYI", "PT", "Q", "I"]
ignore = ["E402", "F403", "F405", "C901", "UP037", "T201"]

[tool.ruff.lint.isort]
force-sort-within-sections = false
extra-standard-library = ["typing_extensions"]




[tool.pdm]
[tool.pdm.scripts]
test = "pytest -v -W ignore"
make = "make"
format = { composite = ["ruff check --select I --fix .","black .","ruff check ."] }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "coverage>=7.17.3",
    "cython>=3.3.1",
    "black>=26.10.1",
    "ruff>=0.17.5",
    "ruamel-yaml>=0.19.1",
]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
